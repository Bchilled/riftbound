<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>How to Play Riftbound</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#07080f}
:root{--gold:#c8a84b;--blue:#1E88E5;--red:#E53935;--green:#22c55e;--purple:#8E24AA}

#stage{position:fixed;inset:0;background:#07080f;cursor:pointer;z-index:0}

/* BG */
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;pointer-events:none}
.bg.on{opacity:1}
#bg-dark{background:radial-gradient(ellipse at 50% 40%,rgba(200,168,75,.06) 0%,transparent 60%),#07080f}
#bg-combat{background:radial-gradient(ellipse at 50% 50%,rgba(239,68,68,.1) 0%,transparent 55%),#07080f}
#bg-score{background:radial-gradient(ellipse at 50% 50%,rgba(34,197,94,.08) 0%,transparent 55%),#07080f}
#bg-spell{background:radial-gradient(ellipse at 50% 50%,rgba(142,36,170,.08) 0%,transparent 55%),#07080f}

/* TEXT TOP */
#txt{position:absolute;top:52px;left:0;right:0;text-align:center;padding:0 20px;z-index:50;pointer-events:none}
#txt-h{font-family:'Cinzel Decorative',serif;font-size:clamp(1.6rem,5vw,3.2rem);font-weight:900;color:var(--gold);letter-spacing:.08em;margin-bottom:10px;opacity:0;transform:translateY(-6px);transition:opacity .45s,transform .45s;text-shadow:0 0 28px rgba(200,168,75,.3)}
#txt-h.on{opacity:1;transform:translateY(0)}
#txt-b{font-family:'Rajdhani',sans-serif;font-size:clamp(1rem,2.6vw,1.4rem);font-weight:600;color:#e8e4d8;line-height:1.65;opacity:0;transform:translateY(-4px);transition:opacity .45s .1s,transform .45s .1s;white-space:pre-line}
#txt-b.on{opacity:1;transform:translateY(0)}

/* PLAYMAT */
#board-wrap{
  position:absolute;left:50%;
  top:clamp(170px,34%,240px);
  transform:translateX(-50%);
  width:min(680px,94vw);
  bottom:32px;
  display:flex;flex-direction:column;gap:5px;
  opacity:0;transition:opacity .8s;
  pointer-events:none;
}
#board-wrap.on{opacity:1}

/* BATTLEFIELD ZONE - shared center, horizontal cards */
#bf-zone{
  display:flex;gap:8px;justify-content:center;flex-shrink:0;
  padding:0 4px;
}
.bf-card-slot{
  flex:1;height:clamp(44px,8vw,64px);
  flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:5px;
}
.bf-h-card{
  width:clamp(44px,8vw,66px);height:clamp(28px,5vw,42px);
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  border:1px solid rgba(200,168,75,.3);border-radius:3px;
  flex-shrink:0;
}

#mat-wrap{
  flex:1;min-height:0;
}
#mat{
  display:flex;flex-direction:row;gap:4px;
  background:linear-gradient(160deg,#070a10,#0a0d1a);
  border:1px solid rgba(200,168,75,.16);
  border-radius:6px;padding:6px;
  height:100%;
}

/* SCORE TRACK */
#stk{display:flex;flex-direction:column;justify-content:space-between;width:22px;flex-shrink:0}
.stc{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(200,168,75,.15);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:.42rem;color:rgba(200,168,75,.2);transition:all .35s;flex-shrink:0}
.stc.hi{border-color:var(--gold)!important;color:var(--gold)!important;background:rgba(200,168,75,.12)!important;box-shadow:0 0 8px rgba(200,168,75,.3)!important}
.stc.scored{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.12);box-shadow:0 0 6px rgba(34,197,94,.25)}

/* CENTER ZONES */
#zones{display:flex;flex-direction:column;flex:1;gap:4px}
#z-bf{flex:1}
#z-base{flex:1.1;position:relative;overflow:hidden}
#bot{display:flex;gap:4px;height:clamp(44px,9vw,72px);flex-shrink:0}
#z-rdeck{width:clamp(36px,6.5vw,54px);flex-shrink:0}
#z-hand{flex:1}
#z-runes{flex:0 0 auto;padding:4px 8px}
#z-trash{width:clamp(36px,6.5vw,54px);flex-shrink:0}

/* RIGHT COL */
#rcol{display:flex;flex-direction:column;gap:4px;width:clamp(50px,9vw,72px);flex-shrink:0}
#z-legend{flex:1}
#z-champ{flex:1}
#z-deck{flex:1}

/* ZONE BASE */
.mz{border:1px solid rgba(200,168,75,.14);background:rgba(200,168,75,.018);display:flex;flex-direction:column;align-items:center;padding:5px 4px;transition:border-color .4s,background .4s,box-shadow .4s;border-radius:2px}
.mz.hi{border-color:rgba(200,168,75,.7)!important;background:rgba(200,168,75,.08)!important;box-shadow:0 0 12px rgba(200,168,75,.12)!important}
.mz.hi-blue{border-color:rgba(30,136,229,.7)!important;background:rgba(30,136,229,.07)!important;box-shadow:0 0 12px rgba(30,136,229,.12)!important}
.mz.hi-red{border-color:rgba(229,57,53,.7)!important;background:rgba(229,57,53,.07)!important;box-shadow:0 0 12px rgba(229,57,53,.12)!important}
.mz.hi-green{border-color:rgba(34,197,94,.7)!important;background:rgba(34,197,94,.07)!important;box-shadow:0 0 12px rgba(34,197,94,.12)!important}
.mz.hi-purple{border-color:rgba(142,36,170,.7)!important;background:rgba(142,36,170,.07)!important;box-shadow:0 0 12px rgba(142,36,170,.12)!important}
.mzl{font-family:'Cinzel',serif;font-size:clamp(.26rem,.44vw,.4rem);letter-spacing:.07em;text-transform:uppercase;color:rgba(200,168,75,.35);text-align:center;line-height:1.3;flex-shrink:0}
#base-swirl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(1.8rem,4vw,3rem);opacity:.05;color:var(--gold);pointer-events:none}
.cb{width:clamp(16px,2.6vw,23px);height:clamp(22px,3.8vw,33px);background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(200,168,75,.25);border-radius:2px;display:inline-block;flex-shrink:0;position:relative;overflow:hidden}
.cb::before{content:'';position:absolute;inset:2px;border:1px solid rgba(200,168,75,.1);border-radius:1px}
.cb.rback{background:linear-gradient(135deg,#1a0a00,#281400);border-color:rgba(200,168,75,.38)}
.cb.unit{background:linear-gradient(135deg,#0d2b4a,#0a1a2e);border-color:rgba(30,136,229,.4)}
.lgcard{width:clamp(24px,4.2vw,38px);height:clamp(34px,6vw,54px);background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(200,168,75,.28);border-radius:2px;margin-top:4px;flex-shrink:0;transition:border-color .4s,box-shadow .4s}
.lgcard.champ{border-color:rgba(30,136,229,.32)}
.rtok{width:clamp(8px,1.5vw,13px);height:clamp(8px,1.5vw,13px);border-radius:50%;border:1.5px solid rgba(200,168,75,.28);background:rgba(200,168,75,.06);display:inline-block;transition:all .35s;flex-shrink:0}
.rtok.lit{background:rgba(200,168,75,.5);border-color:var(--gold);box-shadow:0 0 6px rgba(200,168,75,.45)}
#hand-cards{display:flex;gap:3px;justify-content:center;align-items:center;height:100%}
#rune-row{display:flex;gap:3px;margin-top:4px;justify-content:center}
#base-units{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:4px}

/* ABCD FLASH */
#abcd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.82);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
#abcd.on{opacity:1}
#abcd-L{font-family:'Cinzel Decorative',serif;font-size:clamp(9rem,26vw,17rem);font-weight:900;line-height:1;text-shadow:0 0 60px currentColor,0 0 130px currentColor}
#abcd-L.pop{animation:lpop .38s cubic-bezier(.36,.07,.19,.97) both}
@keyframes lpop{0%{transform:scale(0);opacity:0}65%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
#abcd-N{font-family:'Cinzel',serif;font-size:clamp(1rem,2.8vw,1.8rem);letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-top:14px}

/* PROGRESS */
#prog{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.04);z-index:200;pointer-events:none}
#prog-bar{height:100%;background:var(--gold);width:0%;transition:width .3s}

/* CONTROLS */
#ctrl{position:absolute;top:12px;right:12px;z-index:200}
.cb2{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border:1px solid rgba(200,168,75,.22);background:rgba(0,0,0,.55);color:rgba(200,168,75,.55);cursor:pointer;transition:all .2s}
.cb2:hover{border-color:rgba(200,168,75,.55);color:var(--gold)}
#back-a{position:absolute;top:12px;left:12px;z-index:200;font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(200,168,75,.28);text-decoration:none;transition:color .2s;pointer-events:all}
#back-a:hover{color:var(--gold)}
#tap-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(200,168,75,.3);z-index:200;animation:pulse 2s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:.6}}
</style>
</head>
<body>
<div id="stage">

<div class="bg on" id="bg-dark"></div>
<div class="bg" id="bg-combat"></div>
<div class="bg" id="bg-score"></div>
<div class="bg" id="bg-spell"></div>

<!-- TEXT -->
<div id="txt"><div id="txt-h"></div><div id="txt-b"></div></div>

<!-- PLAYMAT -->
<div id="mat-wrap">
<div id="mat">
  <!-- Score track -->
  <div id="stk">
    <div class="stc" id="s8">8</div>
    <div class="stc" id="s7">7</div>
    <div class="stc" id="s6">6</div>
    <div class="stc" id="s5">5</div>
    <div class="stc" id="s4">4</div>
    <div class="stc" id="s3">3</div>
    <div class="stc" id="s2">2</div>
    <div class="stc" id="s1">1</div>
  </div>
  <!-- Center -->
  <div id="zones">
    <div class="mz" id="z-bf"><div class="mzl">Battlefield</div></div>
    <div class="mz" id="z-base"><div class="mzl">Base</div><div id="base-units"></div><div id="base-swirl">⟳</div></div>
    <div id="bot">
      <div class="mz" id="z-rdeck"><div class="mzl">Rune Deck</div><div class="cb rback" style="margin-top:3px"></div></div>
      <div class="mz" id="z-hand"><div id="hand-cards"><div class="cb"></div><div class="cb"></div><div class="cb"></div><div class="cb"></div></div></div>
      <div class="mz" id="z-runes"><div class="mzl">Runes</div><div id="rune-row"><div class="rtok" id="r1"></div><div class="rtok" id="r2"></div><div class="rtok" id="r3" style="opacity:0"></div><div class="rtok" id="r4" style="opacity:0"></div><div class="rtok" id="r5" style="opacity:0"></div><div class="rtok" id="r6" style="opacity:0"></div></div></div>
      <div class="mz" id="z-trash"><div class="mzl">Discard</div></div>
    </div>
  </div>
  <!-- Right col -->
  <div id="rcol">
    <div class="mz" id="z-legend"><div class="mzl">Champion Legend</div><div class="lgcard"></div></div>
    <div class="mz" id="z-champ"><div class="mzl">Chosen Champion</div><div class="lgcard champ"></div></div>
    <div class="mz" id="z-deck"><div class="mzl">Main Deck</div><div class="cb" style="margin-top:4px"></div></div>
  </div>
</div>
</div>

<!-- ABCD -->
<div id="abcd"><div id="abcd-L"></div><div id="abcd-N"></div></div>

<div id="prog"><div id="prog-bar"></div></div>
<div id="ctrl"><button class="cb2" onclick="restart();event.stopPropagation()">↺</button></div>
<a href="index.html" id="back-a" onclick="event.stopPropagation()">← Decks</a>
<div id="tap-hint">TAP TO CONTINUE</div>

<script>
const BEATS = [
  // INTRO
  { h:'How to Play', b:'', hi:[], bg:'dark' },
  { h:'First to 8 points wins.', b:'', hi:['s1','s2','s3','s4','s5','s6','s7','s8'], bg:'dark', score:true },

  // BOARD ZONES
  { h:'The Legend', b:'Defines your deck.\nSits in the Champion Legend zone.\nActive from turn one.', hi:['z-legend'], bg:'dark' },
  { h:'The Champion', b:'Your chosen unit.\nPlayed from hand like any card.', hi:['z-champ'], bg:'dark' },
  { h:'Runes', b:'Your resource.\nDrawn from your 12-card Rune Deck each turn.', hi:['z-rdeck','z-runes'], bg:'dark' },
  { h:'Discard Pile', b:'Cards go here after being played or destroyed.', hi:['z-trash'], bg:'dark' },
  { h:'Your Base', b:'Where your units start.\nCards are played here first.', hi:['z-base'], bg:'dark' },
  { h:'The Battlefield', b:'Where points are won.\nConquer it. Hold it.', hi:['z-bf'], bg:'dark' },

  // SETUP
  { h:'Roll for First', b:'Winner chooses who goes first.\nMost take first.', hi:[], bg:'dark' },
  { h:'Going Second?', b:'You conjure 3 runes on your first turn\ninstead of 2.', hi:['z-rdeck','z-runes'], bg:'dark' },
  { h:"Let's Learn by Playing", b:'', hi:[], bg:'dark' },
  { h:'Draw 4', b:'Each player draws 4 cards to start.', hi:['z-hand','z-deck'], bg:'dark' },
  { h:'Mulligan', b:'Not happy?\nPut up to 2 cards randomly at the bottom of your deck.\nDraw that many back. Once.', hi:['z-hand','z-deck'], bg:'dark' },

  // ABCD
  { abcd:'A', name:'Awaken', color:'#c8a84b' },
  { h:'A — Awaken', b:'Untap everything.\nUnits. Runes. Legend.\nAll ready to use again.', hi:['z-legend','z-runes','z-base'], bg:'dark' },

  { abcd:'B', name:'Board State', color:'#1E88E5' },
  { h:'B — Board State', b:'Score points for any battlefield you held.\nRead the board. Plan your turn.', hi:['z-bf','s1','s2'], bg:'dark' },

  { abcd:'C', name:'Conjure', color:'#E53935' },
  { h:'C — Conjure', b:'Draw 2 runes from your Rune Deck.\nSpend them to play cards.\nUnused runes disappear end of turn.', hi:['z-rdeck','z-runes'], bg:'dark' },

  { abcd:'D', name:'Draw', color:'#43A047' },
  { h:'D — Draw', b:'Draw 1 card.\nNow play your turn.', hi:['z-deck','z-hand'], bg:'dark' },

  // GAMEPLAY
  { h:'Conquering', b:'Move a ready unit from your base to the battlefield.\nNobody there — you conquer it.\n1 point.', hi:['z-base','z-bf'], bg:'dark' },
  { h:'Combat', b:'Enemy units there — Showdown.\nBoth sides add Might.\nAssign damage. Surviving side conquers.\nUnits fully heal after.', hi:['z-bf'], bg:'combat' },
  { h:'Spells & Reactions', b:'Play spells from your hand at any time.\nReactions trigger on your opponent\'s turn too.\nUse them to swing combat.', hi:['z-hand'], bg:'spell' },
  { h:'Holding', b:'Unit still on the battlefield at your next B step?\nThat\'s another point. Free.\nHolding wins games.', hi:['z-bf'], bg:'dark' },
  { h:'Equipment', b:'Gear cards attach to units.\nThey boost Might and add abilities.\nEquipped units are harder to kill.', hi:['z-base','z-bf'], bg:'dark' },
  { h:'Ganking', b:'Units with GANKING can move between battlefields freely.\nChase down enemies. Reinforce allies.\nControl both fields at once.', hi:['z-bf'], bg:'dark' },
  { h:'Counterspells', b:'Some reactions cancel your opponent\'s spells entirely.\nTiming matters. Hold them until they commit.', hi:['z-hand'], bg:'spell' },

  // WINNING
  { h:'Winning at 7', b:'Holding a battlefield at 7 points?\nScore it during B — that\'s 8. You win.', hi:['s7','s8','z-bf'], bg:'score' },
  { h:'Winning at 6', b:'Capture both battlefields in one turn.\n6 becomes 7 becomes 8. You win.', hi:['s6','s7','s8','z-bf'], bg:'score' },
  { h:'The Final Point Rule', b:'Your 8th point must come from holding\nor conquering both fields same turn.\n\nOne conquest alone for point 8 = draw a card instead.', hi:['s8'], bg:'score' },
  { h:'Shuffle Up.', b:'That\'s Riftbound.\nA  B  C  D\nGood luck.', hi:[], bg:'dark' },
];

let idx = 0;

function clearHi(){
  document.querySelectorAll('.mz,.stc,.bf-card-slot').forEach(z=>{
    z.classList.remove('hi','hi-blue','hi-red','hi-green','hi-purple');
  });
}

function applyHi(ids){
  clearHi();
  (ids||[]).forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.classList.add('hi');
  });
}

function setBg(t){
  document.querySelectorAll('.bg').forEach(b=>b.classList.remove('on'));
  document.getElementById('bg-'+(t||'dark')).classList.add('on');
}

function setText(h,b){
  const H=document.getElementById('txt-h'),B=document.getElementById('txt-b');
  H.classList.remove('on');B.classList.remove('on');
  void H.offsetWidth;
  H.textContent=h||''; B.textContent=b||'';
  requestAnimationFrame(()=>{ H.classList.add('on'); B.classList.add('on'); });
}

function showAbcd(l,n,c){
  const L=document.getElementById('abcd-L'),N=document.getElementById('abcd-N');
  L.textContent=l; L.style.color=c||'#c8a84b'; N.textContent=n||'';
  L.classList.remove('pop'); void L.offsetWidth; L.classList.add('pop');
  document.getElementById('abcd').classList.add('on');
  setText('','');
}

function hideAbcd(){ document.getElementById('abcd').classList.remove('on'); }

function scoreAnimate(){
  const ids=['s1','s2','s3','s4','s5','s6','s7','s8'];
  // Reset all
  ids.forEach(id=>{
    const el=document.getElementById(id);
    el.classList.remove('hi','scored');
    el.style.borderColor='';el.style.color='';el.style.background='';el.style.boxShadow='';
  });

  // Highlight battlefield zone
  document.getElementById('z-bf').classList.add('hi');
  document.getElementById('z-bf2').classList.add('hi');
  document.getElementById('z-bf2').classList.add('hi');

  // Animate a unit moving to battlefield at score 1
  setTimeout(()=>{
    setText('Conquering','Move a unit to the battlefield.\nNobody there — you take it.\n+1 point.');
    // Add a unit token to base then bf
    const bu = document.getElementById('base-units');
    bu.innerHTML = '<div class="cb unit" style="transition:all .5s"></div>';
  }, 400);

  // Score 1-4 with conquering message
  ids.slice(0,4).forEach((id,i)=>{
    setTimeout(()=>{
      const el=document.getElementById(id);
      el.style.borderColor='#c8a84b';
      el.style.color='#c8a84b';
      el.style.background='rgba(200,168,75,.15)';
      el.style.boxShadow='0 0 10px rgba(200,168,75,.4)';
    }, 400 + i*1800);
  });

  // Switch to holding message at score 5
  setTimeout(()=>{
    setText('Holding','Unit still there next turn?\nScore again during upkeep.\n+1 point every turn you hold.');
  }, 400 + 4*1800);

  // Score 5-8 with holding message
  ids.slice(4).forEach((id,i)=>{
    setTimeout(()=>{
      const el=document.getElementById(id);
      el.style.borderColor='#c8a84b';
      el.style.color='#c8a84b';
      el.style.background='rgba(200,168,75,.15)';
      el.style.boxShadow='0 0 10px rgba(200,168,75,.4)';
    }, 400 + (4+i)*1800);
  });
}

function play(i){
  if(i>=BEATS.length){ end(); return; }
  idx=i;
  const b=BEATS[i];
  document.getElementById('prog-bar').style.width=((i/BEATS.length)*100)+'%';
  document.getElementById('board-wrap').classList.add('on');

  if(b.abcd){
    hideAbcd();
    clearHi();
    setBg('dark');
    setTimeout(()=>showAbcd(b.abcd,b.name,b.color),50);
    return;
  }

  hideAbcd();
  setBg(b.bg||'dark');
  applyHi(b.hi||[]);
  setText(b.h||'',b.b||'');
  if(b.score) setTimeout(scoreAnimate,400);
}

function advance(){
  if(document.getElementById('abcd').classList.contains('on')){
    hideAbcd();
    // Show the next text beat automatically
    if(idx+1 < BEATS.length && !BEATS[idx+1].abcd){
      play(idx+1);
    } else {
      play(idx+1);
    }
    return;
  }
  play(idx+1);
}

function end(){
  document.getElementById('prog-bar').style.width='100%';
  document.getElementById('tap-hint').style.display='none';
}

function restart(){
  idx=0;
  hideAbcd();
  clearHi();
  document.getElementById('board-wrap').classList.remove('on');
  document.getElementById('prog-bar').style.width='0%';
  document.getElementById('tap-hint').style.display='block';
  setTimeout(()=>play(0),300);
}

document.addEventListener('click', function(e){ if(e.target.closest('#back-a')||e.target.closest('#ctrl')) return; advance(); });
window.addEventListener('load', ()=>play(0));
</script>
</div>
</body>
</html>
