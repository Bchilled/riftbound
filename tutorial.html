<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Rajdhani',sans-serif}
#stage{position:fixed;inset:0;background:#07080f;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .8s ease}
.scene.active{opacity:1;pointer-events:all}

/* JOHN */
#jc{position:fixed;bottom:0;left:0;right:0;height:185px;z-index:100;pointer-events:none;display:flex;align-items:flex-end;justify-content:center}
#jw{position:relative;display:flex;align-items:flex-end;gap:14px;padding:0 24px;width:100%;max-width:1000px}
#jsv{width:110px;height:140px;flex-shrink:0;filter:drop-shadow(0 -4px 20px rgba(200,168,75,.3));transition:transform .15s}
#jb{position:relative;background:#1a1400;border:2px solid #c8a84b;padding:11px 16px;border-radius:12px 12px 12px 0;max-width:420px;margin-bottom:36px;opacity:0;transition:opacity .3s;flex-shrink:1}
#jb.show{opacity:1}
#jbt{font-family:'Caveat',cursive;font-size:1.1rem;color:#e8e4d8;line-height:1.4}
#jbt.yell{font-family:'Cinzel Decorative',serif;font-size:clamp(1.6rem,4vw,2.6rem);color:#c8a84b;font-weight:900;letter-spacing:.1em}

/* SNOW */
#sb{position:fixed;top:16px;left:50%;transform:translateX(-50%);max-width:720px;width:92%;background:rgba(0,18,36,.93);border:1px solid rgba(11,196,227,.4);padding:15px 20px;border-radius:12px;opacity:0;transition:opacity .4s;z-index:99;text-align:center}
#sb.show{opacity:1}
#st{font-family:'Rajdhani',sans-serif;font-size:clamp(.95rem,2.4vw,1.25rem);color:#e8e4d8;line-height:1.6}
#st .b{color:#c8a84b;font-weight:700}
#st .r{color:#ef4444;font-weight:700}
#st .g{color:#22c55e;font-weight:700}

/* ABCD FLASH */
#af{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);opacity:0;pointer-events:none;transition:opacity .3s}
#af.show{opacity:1}
#al{font-family:'Cinzel Decorative',serif;font-size:clamp(7rem,22vw,16rem);font-weight:900;line-height:.85;text-shadow:0 0 80px currentColor;animation:boom .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes boom{0%{transform:scale(0) rotate(-8deg)}60%{transform:scale(1.2) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
#an{font-family:'Cinzel',serif;font-size:clamp(1.1rem,3.5vw,2.2rem);letter-spacing:.3em;text-transform:uppercase;color:#e8e4d8;margin-top:14px;opacity:.8}

/* POINTS */
#pts{position:fixed;top:14px;right:18px;display:flex;gap:10px;z-index:98}
.ptb{background:rgba(0,0,0,.75);border:1px solid rgba(200,168,75,.2);padding:7px 14px;text-align:center}
.ptl{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.15em;text-transform:uppercase;color:#5a5550}
.ptv{font-family:'Cinzel Decorative',serif;font-size:1.6rem;color:#c8a84b}
.ptb.win .ptv{color:#22c55e;text-shadow:0 0 20px #22c55e}
.ptf{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:'Cinzel Decorative',serif;font-size:clamp(2.5rem,9vw,5rem);font-weight:900;pointer-events:none;z-index:180;animation:ptA 1.4s ease both}
@keyframes ptA{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-65%) scale(1)}100%{opacity:0;transform:translate(-50%,-85%) scale(.7)}}

/* PROGRESS */
#prog{position:fixed;bottom:188px;left:0;right:0;height:2px;background:rgba(255,255,255,.04);z-index:101}
#pb{height:100%;background:linear-gradient(90deg,#c8a84b,#e8c96a);width:0%;transition:width .3s linear}

/* CONTROLS */
#ctrl{position:fixed;bottom:193px;right:14px;display:flex;gap:7px;z-index:102}
.cb{background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.28);color:#c8a84b;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;padding:5px 11px;cursor:pointer;transition:all .2s;border-radius:2px}
.cb:hover{background:rgba(200,168,75,.22)}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;padding:9px 18px;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);z-index:97}
#nav a{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#c8a84b;text-decoration:none;opacity:.55}
#nav a:hover{opacity:1}

/* SCENE: TITLE */
#sc0{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(200,168,75,.09),transparent 60%),#07080f}
#sc0 h1{font-family:'Cinzel Decorative',serif;font-size:clamp(2rem,7vw,5rem);font-weight:900;background:linear-gradient(180deg,#fff9e8,#c8a84b 50%,#7a5c18);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.15em;text-align:center;animation:tIn 1.5s ease both}
#sc0 .ep{font-family:'Cinzel',serif;font-size:clamp(.75rem,1.8vw,1rem);color:#9a9080;letter-spacing:.4em;text-transform:uppercase;margin-top:11px;animation:tIn 1.5s .3s ease both}
#sc0 .sh{font-family:'Rajdhani',sans-serif;font-size:.88rem;color:#5a5550;margin-top:38px;letter-spacing:.15em;text-transform:uppercase;animation:pulse 2s ease-in-out infinite}
@keyframes tIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* SCENE: LOL MAP */
#sc1{display:flex;align-items:center;justify-content:center;background:#060a06}
#lw{position:relative;width:min(560px,88vw);height:min(560px,78vh)}

/* SCENE: BOARD */
#sc2{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 18px 195px;background:#07080f;overflow:hidden}
.bw{width:100%;max-width:800px;display:flex;flex-direction:column;gap:5px;flex:1}
.or{display:flex;gap:5px;justify-content:center;opacity:.28;filter:blur(1px)}
.bfr{display:flex;gap:7px;justify-content:center;flex:1}
.bf{flex:1;max-width:350px;min-height:110px;border:2px solid rgba(200,168,75,.38);background:rgba(200,168,75,.03);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;position:relative;transition:border-color .3s,box-shadow .3s}

.bfn{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:#c8a84b}
.pr{display:flex;gap:5px;justify-content:center}
.zb{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.02);padding:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:62px;min-height:54px}

.zb.ch{border-color:rgba(11,196,227,.28);background:rgba(11,196,227,.04)}

.card{width:42px;height:58px;border-radius:3px;border:1px solid rgba(200,168,75,.45);background:linear-gradient(135deg,#1a1428,#0f0d1a);display:flex;align-items:center;justify-content:center;font-size:.38rem;color:rgba(200,168,75,.35);flex-shrink:0;transition:all .3s;box-shadow:0 2px 7px rgba(0,0,0,.5);position:relative}

.rc{width:34px;height:48px;border-radius:3px;border:1px solid;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0}

@media(max-width:580px){.zb{min-width:48px;min-height:46px}.card{width:34px;height:48px}}

<script>
const T=(()=>{
const W=t=>new Promise(r=>setTimeout(r,t));
let sy=window.speechSynthesis,vs=[],sv=null,jv=null,sOn=true,yp=0,op=0,cur=0,going=false;

function lv(){
  vs=sy.getVoices();
  sv=vs.find(v=>v.lang==='en-US'&&/zira|samantha|karen|google us/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs[0];
  jv=vs.find(v=>v.lang==='en-GB'&&/daniel|george|oliver/i.test(v.name))||vs.find(v=>v.lang==='en-GB')||vs[1]||vs[0];
}
if(sy.onvoiceschanged!==undefined)sy.onvoiceschanged=lv;
setTimeout(lv,400);

function spk(txt,isJ=false){
  if(!sOn)return Promise.resolve();
  return new Promise(r=>{
    sy.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.voice=isJ?jv:sv;
    u.rate=isJ?.86:1.12;
    u.pitch=isJ?.88:1.06;
    u.volume=1;
    u.onend=r;u.onerror=r;
    sy.speak(u);
  });
}

function sno(html,txt=''){

function flash(ltr,nm,col){
  const e=document.getElementById('af'),l=document.getElementById('al'),n=document.getElementById('an');

function apt(who,n){
  if(who==='y'){yp+=n;document.getElementById('pyv').textContent=yp;if(yp>=8)document.getElementById('pty').classList.add('win')}

  document.body.appendChild(f);setTimeout(()=>f.remove(),1500);
  if(sOn){const ac=new AudioContext(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=who==='y'?900:400;g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToConstantValue(.001,ac.currentTime+.35);o.start();o.stop(ac.currentTime+.35)}
}

function cpsnd(){
  if(!sOn)return;
  const ac=new AudioContext(),buf=ac.createBuffer(1,ac.sampleRate*.12,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)*.25;
  const s=ac.createBufferSource();s.buffer=buf;
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1100;
  s.connect(f);f.connect(ac.destination);s.start();
}

async function mvcard(id,targetId){
  const card=document.getElementById(id),tar=document.getElementById(targetId);
  if(!card||!tar)return;
  const fr=card.getBoundingClientRect(),to=tar.getBoundingClientRect();
  const clone=card.cloneNode(true);
  clone.style.cssText=`position:fixed;left:${fr.left}px;top:${fr.top}px;width:${fr.width}px;height:${fr.height}px;z-index:150;transition:none;margin:0`;
  document.body.appendChild(clone);
  card.style.opacity='0';
  cpsnd();
  await W(50);
  clone.style.transition='all .75s cubic-bezier(.4,0,.2,1)';
  clone.style.left=(to.left+to.width/2-fr.width/2)+'px';
  clone.style.top=(to.top+to.height/2-fr.height/2)+'px';
  await W(800);
  clone.remove();
  card.style.opacity='1';
  tar.appendChild(card);
}
