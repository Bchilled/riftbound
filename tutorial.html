<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Riftbound — How to Play with John</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Rajdhani',sans-serif}
:root{--gold:#c8a84b;--bg:#07080f}

#stage{position:fixed;inset:0;background:var(--bg);overflow:hidden}

/* SCENE BACKGROUNDS */
.scene-layer{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;background-size:cover;background-position:center}
.scene-layer.on{opacity:1}
#bg-lol{
  background-image:url('https://images.weserv.nl/?url=static.wikia.nocookie.net/leagueoflegends/images/0/01/Summoner%27s_Rift_Map.png&w=1200');
  filter:saturate(.35) brightness(.28);
}
#bg-dark{background:radial-gradient(ellipse at 50% 30%,rgba(200,168,75,.07) 0%,transparent 65%),#07080f}
#bg-combat{background:radial-gradient(ellipse at 50% 50%,rgba(239,68,68,.18) 0%,transparent 60%),#07080f}
#bg-win{background:radial-gradient(ellipse at 50% 50%,rgba(34,197,94,.12) 0%,transparent 60%),#07080f}

/* BOARD */
#board{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-60%);
  width:min(680px,90vw);
  opacity:0;transition:opacity .8s;
}
#board.on{opacity:1}



.cback{width:26px;height:38px;background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(200,168,75,.35);border-radius:3px;position:relative;overflow:hidden;display:inline-block}
.cback::before{content:'';position:absolute;inset:2px;border:1px solid rgba(200,168,75,.18);border-radius:2px}
.cback::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(200,168,75,.04) 3px,rgba(200,168,75,.04) 4px)}
.cback.unit{background:linear-gradient(135deg,#0d2b4a,#0a1a2e);border-color:rgba(11,196,227,.45)}
.cback.unit::after{background:none}

.rtok{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(200,168,75,.4);background:rgba(200,168,75,.1);display:inline-block}
.rtok.lit{background:rgba(200,168,75,.5);box-shadow:0 0 7px rgba(200,168,75,.55)}

.unit-tok{
  width:18px;height:18px;border-radius:3px;
  background:rgba(11,196,227,.5);border:1.5px solid rgba(11,196,227,.8);
  box-shadow:0 0 7px rgba(11,196,227,.35);
  display:inline-block;transition:all .5s;
}
.unit-tok.enemy{background:rgba(239,68,68,.5);border-color:rgba(239,68,68,.8);box-shadow:0 0 7px rgba(239,68,68,.35)}

.opp{opacity:.28}

/* ABCD FLASH */
#abcd{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#abcd.on{opacity:1}
#abcd-L{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(7rem,22vw,15rem);
  font-weight:900;line-height:1;
  text-shadow:0 0 60px currentColor,0 0 120px currentColor;
}
#abcd-L.pop{animation:lPop .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes lPop{0%{transform:scale(0) rotate(-8deg);opacity:0}65%{transform:scale(1.18) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
#abcd-S{
  font-family:'Cinzel',serif;
  font-size:clamp(.9rem,2.5vw,1.6rem);
  letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.75);margin-top:10px;
}

/* SCORE POP */
#score-pop{
  position:absolute;top:40%;left:50%;transform:translateX(-50%);
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(2.5rem,8vw,6rem);color:#22c55e;font-weight:900;
  text-shadow:0 0 40px rgba(34,197,94,.6);
  opacity:0;pointer-events:none;z-index:70;transition:opacity .25s;
}
#score-pop.on{opacity:1;animation:sPop .5s ease}
@keyframes sPop{0%{transform:translateX(-50%) scale(.4)}65%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1)}}

/* EPISODE TITLE */
#eptitle{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:80;opacity:0;transition:opacity .7s;pointer-events:none;
}
#eptitle.on{opacity:1}
#eptitle h1{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.8rem,5.5vw,4rem);
  background:linear-gradient(180deg,#fff9e8,#c8a84b 50%,#7a5c18);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;letter-spacing:.12em;margin-bottom:10px;
}
#eptitle p{font-family:'Cinzel',serif;font-size:clamp(.75rem,1.8vw,1.05rem);color:rgba(255,255,255,.35);letter-spacing:.3em;text-transform:uppercase}

/* JOHN - FIXED BOTTOM */
#john-wrap{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;align-items:flex-end;z-index:100;pointer-events:none;
}
#john-fig{
  flex-shrink:0;
  width:clamp(90px,16vw,170px);
  margin-bottom:-3px;
  transition:transform .5s cubic-bezier(.4,0,.2,1);
}
#john-fig.out{transform:translateX(-110%)}

/* SPEECH BUBBLE */
#speech{
  flex:1;max-width:580px;margin:0 18px 28px;
  background:rgba(8,10,22,.93);
  border:1px solid rgba(200,168,75,.28);
  padding:14px 18px;position:relative;
  opacity:0;transform:translateY(8px);
  transition:opacity .4s,transform .4s;
}
#speech.on{opacity:1;transform:translateY(0)}
#speech::before{content:'';position:absolute;bottom:18px;left:-7px;border:3.5px solid transparent;border-right-color:rgba(200,168,75,.28)}
#sp-name{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
#sp-text{font-family:'Rajdhani',sans-serif;font-size:clamp(.82rem,1.9vw,1.08rem);color:#e8e4d8;line-height:1.6;min-height:36px}

/* PROGRESS */
#prog{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.04);z-index:200}
#prog-bar{height:100%;background:var(--gold);width:0%;transition:width .15s linear}

/* CONTROLS */
#ctrl{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:200}
.cbtn{
  font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  padding:6px 13px;border:1px solid rgba(200,168,75,.28);
  background:rgba(0,0,0,.55);color:rgba(200,168,75,.65);cursor:pointer;transition:all .2s;
}
.cbtn:hover{border-color:rgba(200,168,75,.65);color:var(--gold)}
#back-lnk{position:absolute;top:14px;left:14px;z-index:200;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(200,168,75,.35);text-decoration:none;transition:color .2s}
#back-lnk:hover{color:var(--gold)}

/* SCORE HUD */
#pts-hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:200;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.2em;color:rgba(200,168,75,.4);text-transform:uppercase;opacity:0;transition:opacity .5s}
#pts-hud.on{opacity:1}

/* ── PLAYMAT ── */
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-58%);width:min(700px,92vw);opacity:0;transition:opacity .8s}
#board.on{opacity:1}
#mat{display:flex;flex-direction:row;gap:5px;background:linear-gradient(160deg,#07090f,#0a0d18);border:1px solid rgba(200,168,75,.2);border-radius:6px;padding:8px;height:clamp(200px,32vw,320px)}
#stk{display:flex;flex-direction:column;justify-content:space-between;width:22px;flex-shrink:0}
.stc{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(200,168,75,.2);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:.46rem;color:rgba(200,168,75,.25);transition:all .4s;flex-shrink:0}
.stc.on{border-color:var(--gold);color:var(--gold);background:rgba(200,168,75,.1);box-shadow:0 0 6px rgba(200,168,75,.2)}
.stc.done{border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.1)}
/* ZONES COLUMN */
#zones{display:flex;flex-direction:column;flex:1;gap:4px}
.mz-bf{flex:1}
.mz-base{flex:1.2;overflow:hidden;position:relative}
#bot-strip{display:flex;gap:4px;height:clamp(44px,8vw,70px);flex-shrink:0}
/* RIGHT COLUMN */
#rcol{display:flex;flex-direction:column;gap:4px;width:clamp(50px,8.5vw,72px);flex-shrink:0}
.mz-rc{flex:1}
/* ZONE BASE */
.mzone{border:1px solid rgba(200,168,75,.18);background:rgba(200,168,75,.02);display:flex;flex-direction:column;align-items:center;padding:5px 4px;transition:all .4s;border-radius:2px}
.mzone.hi{border-color:rgba(200,168,75,.7);background:rgba(200,168,75,.07);box-shadow:0 0 10px rgba(200,168,75,.12)}
.mzone.won{border-color:#22c55e;background:rgba(34,197,94,.06)}
.mzlbl{font-family:'Cinzel',serif;font-size:clamp(.28rem,.48vw,.42rem);letter-spacing:.07em;text-transform:uppercase;color:rgba(200,168,75,.4);text-align:center;line-height:1.3;flex-shrink:0}
.mz-rdeck{width:clamp(36px,6vw,54px);flex-shrink:0}
.mz-hand{flex:1}
.mz-runes{flex:0 0 auto;padding:4px 6px}
/* Swirl watermark */
#swirl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(1.8rem,4.5vw,3.5rem);opacity:.06;color:var(--gold);pointer-events:none}
/* Base units */
#base-units{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:5px}
/* Runes */
#rune-row{display:flex;gap:3px;margin-top:4px;justify-content:center}
/* Hand */
#hand-cards{display:flex;gap:4px;justify-content:center;align-items:center;height:100%}
/* Card backs */
.cback{width:clamp(18px,3vw,26px);height:clamp(26px,4.2vw,37px);background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(200,168,75,.3);border-radius:2px;position:relative;overflow:hidden;display:inline-block;flex-shrink:0}
.cback::before{content:'';position:absolute;inset:2px;border:1px solid rgba(200,168,75,.14);border-radius:1px}
.cback::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(200,168,75,.03) 3px,rgba(200,168,75,.03) 4px)}
.rback{background:linear-gradient(135deg,#1a0a00,#2a1500);border-color:rgba(200,168,75,.42)}
/* Legend card */
.lgcard{width:clamp(28px,4.8vw,42px);height:clamp(40px,6.8vw,60px);background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(200,168,75,.35);border-radius:2px;margin-top:4px;flex-shrink:0}
.lgcard.champ{border-color:rgba(11,196,227,.38)}
/* Rune tokens */
.rtok{width:clamp(10px,1.8vw,15px);height:clamp(10px,1.8vw,15px);border-radius:50%;border:1.5px solid rgba(200,168,75,.35);background:rgba(200,168,75,.08);display:inline-block;transition:all .3s;flex-shrink:0}
.rtok.lit{background:rgba(200,168,75,.45);box-shadow:0 0 5px rgba(200,168,75,.45)}

</style>
</head>

</div>
</div>

<!-- JOHN BOTTOM -->
<div id="john-wrap">
  <div id="john-fig">
    <svg viewBox="0 0 180 230" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;filter:drop-shadow(0 -4px 18px rgba(200,168,75,.14))">

<script>
// ── AUDIO ──
let AC = null, muted = false;
function ac(){ if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)(); return AC; }
function toggleMute(){ muted=!muted; document.getElementById('btn-mute').textContent=muted?'🔇':'🔊'; }

function sfx(t){
  if(muted) return;
  const a=ac(), g=a.createGain(); g.connect(a.destination);
  if(t==='C'){
    const o=a.createOscillator(),g2=a.createGain();
    o.connect(g2);g2.connect(a.destination);
    o.type='sawtooth';
    o.frequency.setValueAtTime(200,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(900,a.currentTime+.07);
    o.frequency.exponentialRampToValueAtTime(400,a.currentTime+.2);
    g2.gain.setValueAtTime(.5,a.currentTime);
    g2.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);
    o.start();o.stop(a.currentTime+.35);
  } else if(t==='card'){
    const b=a.createBuffer(1,a.sampleRate*.1,a.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const s=a.createBufferSource(),f=a.createBiquadFilter();
    f.type='highpass';f.frequency.value=2500;
    s.buffer=b;s.connect(f);f.connect(g);g.gain.setValueAtTime(.25,a.currentTime);s.start();
  } else if(t==='point'){
    [523,659,784].forEach((f,i)=>{
      const o=a.createOscillator(),g2=a.createGain();
      o.connect(g2);g2.connect(a.destination);
      o.type='sine';o.frequency.value=f;
      const T=a.currentTime+i*.1;
      g2.gain.setValueAtTime(.28,T);g2.gain.exponentialRampToValueAtTime(.001,T+.45);
      o.start(T);o.stop(T+.45);
    });
  } else if(t==='hit'){
    const b=a.createBuffer(1,a.sampleRate*.28,a.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)*(i<800?1:.25);
    const s=a.createBufferSource(),f=a.createBiquadFilter();
    f.type='lowpass';f.frequency.value=700;
    s.buffer=b;s.connect(f);f.connect(g);g.gain.setValueAtTime(.45,a.currentTime);s.start();
  } else if(t==='rune'){
    [1046,1319,1568].forEach((f,i)=>{
      const o=a.createOscillator(),g2=a.createGain();
      o.connect(g2);g2.connect(a.destination);
      o.type='triangle';o.frequency.value=f;
      const T=a.currentTime+i*.07;
      g2.gain.setValueAtTime(.14,T);g2.gain.exponentialRampToValueAtTime(.001,T+.4);
      o.start(T);o.stop(T+.4);
    });
  } else if(t==='shuffle'){
    for(let i=0;i<5;i++){
      const b=a.createBuffer(1,a.sampleRate*.055,a.sampleRate),d=b.getChannelData(0);
      for(let j=0;j<d.length;j++) d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2);
      const s=a.createBufferSource();s.buffer=b;s.connect(g);
      g.gain.setValueAtTime(.18,a.currentTime+i*.08);s.start(a.currentTime+i*.08);
    }
  } else if(t==='awaken'){
    [261,329,392,523].forEach((f,i)=>{
      const o=a.createOscillator(),g2=a.createGain();
      o.connect(g2);g2.connect(a.destination);o.type='sine';o.frequency.value=f;
      g2.gain.setValueAtTime(0,a.currentTime);
      g2.gain.linearRampToValueAtTime(.13,a.currentTime+.22);
      g2.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.6);
      o.start();o.stop(a.currentTime+1.6);
    });
  } else if(t==='win'){
    [523,659,784,1046,1318].forEach((f,i)=>{
      const o=a.createOscillator(),g2=a.createGain();
      o.connect(g2);g2.connect(a.destination);o.type='square';o.frequency.value=f;
      const T=a.currentTime+i*.13;
      g2.gain.setValueAtTime(.18,T);g2.gain.exponentialRampToValueAtTime(.001,T+.55);
      o.start(T);o.stop(T+.55);
    });
  }
}

// ── SPEECH SYNTHESIS ──
let voices=[], johnV=null;
function loadV(){
  voices=window.speechSynthesis.getVoices();
  const pref=['Google UK English Male','Microsoft David','Daniel','Alex','en-GB'];
  for(let p of pref){ let v=voices.find(x=>x.name.includes(p)||x.lang===p); if(v){johnV=v;break;} }
  if(!johnV) johnV=voices.find(v=>v.lang.startsWith('en'))||voices[0];
}
window.speechSynthesis.onvoiceschanged=loadV;
setTimeout(loadV,400);

function say(text,rate,pitch,onend){
  if(muted){if(onend)setTimeout(onend,100);return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(johnV)u.voice=johnV;
  u.rate=rate||0.92;u.pitch=pitch||0.82;u.volume=1;
  if(onend)u.onend=onend;
  window.speechSynthesis.speak(u);
}

// ── CONTROLLER ──
let idx=0, paused=false, timer=null;
const total=BEATS.reduce((a,b)=>a+b.dur,0);
let elapsed=0;

const COLORS={A:'#c8a84b',B:'#1E88E5',C:'#E53935',D:'#43A047'};

function hi(ids){
  document.querySelectorAll('.mzone').forEach(z=>z.classList.remove('hi'));
  (ids||[]).forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('hi');});
}

function setBg(t){
  ['bg-lol','bg-dark','bg-combat','bg-win'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById('bg-'+t).classList.add('on');
}

function showBoard(){document.getElementById('board').classList.add('on')}
function hideBoard(){document.getElementById('board').classList.remove('on')}

function showABCD(letter,sub,color){
  const fl=document.getElementById('abcd');
  const L=document.getElementById('abcd-L');
  const S=document.getElementById('abcd-S');
  L.textContent=letter;L.style.color=color||'#c8a84b';
  S.textContent=sub||'';
  L.classList.remove('pop');void L.offsetWidth;L.classList.add('pop');
  fl.classList.add('on');
  sfx('C');
  if(!muted){
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(letter+'!');
    if(johnV)u.voice=johnV;u.rate=0.6;u.pitch=0.55;u.volume=1;
    window.speechSynthesis.speak(u);
  }
}
function hideABCD(){document.getElementById('abcd').classList.remove('on')}

function setSpeech(t){
  const sp=document.getElementById('speech');
  document.getElementById('sp-text').textContent=t;
  sp.classList.add('on');
}
function hideSpeech(){document.getElementById('speech').classList.remove('on')}

function setProgress(p){document.getElementById('prog-bar').style.width=p+'%'}

function next(){
  if(idx>=BEATS.length){done();return;}
  if(paused)return;
  const b=BEATS[idx];
  setProgress((elapsed/total)*100);

  if(b.type==='title'){
    hideBoard();hideSpeech();hideABCD();setBg('dark');
    const t=document.getElementById('eptitle');
    t.classList.add('on');
    timer=setTimeout(()=>{t.classList.remove('on');elapsed+=b.dur;idx++;next();},b.dur);
    return;
  }

  if(b.type==='C'||b.type==='A'||b.type==='B'||b.type==='D'){
    hideBoard();hideSpeech();
    if(b.sfx)sfx(b.sfx);
    showABCD(b.type,b.sub,COLORS[b.type]);
    timer=setTimeout(()=>{hideABCD();showBoard();elapsed+=b.dur;idx++;next();},b.dur);
    return;
  }

  if(b.type==='say'){
    hideABCD();showBoard();
    setBg(b.bg||'dark');
    hi(b.hi||[]);
    if(b.sfx)setTimeout(()=>sfx(b.sfx),150);
    setSpeech(b.text);
    say(b.text);
    timer=setTimeout(()=>{elapsed+=b.dur;idx++;next();},b.dur);
    return;
  }
}

function done(){
  setProgress(100);
  hideSpeech();hideABCD();
  setSpeech("That is Riftbound. A B C D. Shuffle up. Play. Good luck. Do not suck.");
  say("That is Riftbound. A B C D. Shuffle up. Play. Good luck. Do not suck.");
}

function togglePause(){
  paused=!paused;
  document.getElementById('btn-pause').textContent=paused?'Play':'Pause';
  if(paused){clearTimeout(timer);window.speechSynthesis.pause();}
  else{window.speechSynthesis.resume();next();}
}

function restart(){
  clearTimeout(timer);window.speechSynthesis.cancel();
  idx=0;elapsed=0;paused=false;
  document.getElementById('btn-pause').textContent='Pause';
  hideABCD();hideSpeech();hideBoard();
  document.querySelectorAll('.bzone,.bbf').forEach(z=>z.classList.remove('hi','won'));
  document.getElementById('eptitle').classList.remove('on');
  setProgress(0);
  setTimeout(()=>next(),500);
}

document.addEventListener('click',()=>{try{ac();}catch(e){}loadV();},{once:true});
window.addEventListener('load',()=>{loadV();setTimeout(()=>next(),900);});
