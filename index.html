<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Riftbound — Choose Your Legend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--mid:#0d0f1a;--panel:#111520;--border:rgba(255,255,255,.06);--gold:#c8a84b;--txt:#e8e4d8;--txt2:#9a9080;--txt3:#5a5550}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden}
.page{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(200,168,75,.1) 0%,transparent 55%),radial-gradient(ellipse at 15% 70%,rgba(30,58,95,.25) 0%,transparent 45%),radial-gradient(ellipse at 85% 70%,rgba(42,122,74,.18) 0%,transparent 45%),var(--bg);position:relative}
.page::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent,transparent 80px,rgba(200,168,75,.025) 80px,rgba(200,168,75,.025) 81px),repeating-linear-gradient(90deg,transparent,transparent 80px,rgba(200,168,75,.025) 80px,rgba(200,168,75,.025) 81px)}
/* HEADER */
.hd{text-align:center;padding:36px 20px 16px;position:relative;z-index:10}
.hd h1{font-family:'Cinzel Decorative',serif;font-size:clamp(2rem,6vw,4.8rem);font-weight:900;line-height:1;background:linear-gradient(180deg,#fff9e8 0%,var(--gold) 45%,#7a5c18 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.15em}
.hd-sub{font-family:'Cinzel',serif;font-size:clamp(.75rem,1.8vw,1rem);color:var(--txt2);letter-spacing:.4em;text-transform:uppercase;margin-top:7px}
.div-line{width:min(500px,75vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto}
.choose-txt{font-family:'Cinzel Decorative',serif;font-size:clamp(1.3rem,4vw,2.8rem);font-weight:700;color:var(--txt);letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px}
/* GRID */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;width:100%;max-width:1400px;margin:0 auto;padding:0 10px;position:relative;z-index:10}
.dcard{position:relative;aspect-ratio:3/4;cursor:pointer;overflow:hidden;border:1px solid rgba(255,255,255,.05);background:var(--mid);transition:all .4s cubic-bezier(.4,0,.2,1)}
.dcard::before{content:'';position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.5) 60%,rgba(0,0,0,.93) 100%);transition:background .4s}
.dcard:hover::before,.dcard.on::before{background:linear-gradient(180deg,rgba(0,0,0,.02) 0%,rgba(0,0,0,.22) 50%,rgba(0,0,0,.95) 100%)}
.dcard::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;border:2px solid transparent;transition:all .3s}
.dcard:hover::after,.dcard.on::after{border-color:var(--ac);box-shadow:0 0 20px rgba(0,0,0,.15)}
.dcard-bar{position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform .35s;z-index:5}
.dcard.on .dcard-bar{transform:scaleX(1)}
.dcard-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .6s cubic-bezier(.4,0,.2,1),filter .4s;filter:saturate(.75) brightness(.8)}
.dcard.rc .dcard-img{object-position:right top}
.dcard:hover .dcard-img,.dcard.on .dcard-img{transform:scale(1.06);filter:saturate(1.1) brightness(1.0)}
.dcard-body{position:absolute;bottom:0;left:0;right:0;padding:11px;z-index:4}
.dcard-tag{font-family:'Rajdhani',sans-serif;font-size:clamp(.5rem,1vw,.72rem);font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:2px 8px;border-radius:2px;display:inline-block;margin-bottom:3px}
.dcard-name{font-family:'Cinzel',serif;font-size:clamp(.85rem,2vw,1.35rem);font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.9);line-height:1;margin-bottom:3px}
.dcard-tagline{font-family:'Rajdhani',sans-serif;font-size:clamp(.52rem,.95vw,.72rem);color:rgba(255,255,255,.55);display:none}
.dcard:hover .dcard-tagline,.dcard.on .dcard-tagline{display:block}
.dcard-colors{font-family:'Rajdhani',sans-serif;font-size:clamp(.46rem,.85vw,.62rem);letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.38)}
.abcd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.abcd-row{display:flex;gap:12px;align-items:flex-start;padding:13px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.055)}
.abcd-ltr{font-family:'Cinzel Decorative',serif;font-size:2.1rem;font-weight:900;line-height:1;flex-shrink:0;width:34px;text-align:center;text-shadow:0 0 18px currentColor}
.abcd-bd h4{font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.1em;color:var(--txt);margin-bottom:3px}
.abcd-bd p{font-family:'Rajdhani',sans-serif;font-size:.87rem;color:var(--txt2);line-height:1.55}
/* DETAIL */
.detail{display:none;width:100%;max-width:1400px;margin:3px auto 0;padding:0 10px 50px;position:relative;z-index:10}
.detail.open{display:block;animation:slideDown .4s cubic-bezier(.4,0,.2,1)}
.d-wrap{background:linear-gradient(135deg,#090d18,var(--panel));border:1px solid var(--dac,rgba(200,168,75,.28));position:relative}
.d-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--dac-c,var(--gold))}
.d-hdr{display:grid;grid-template-columns:100px 1fr;gap:22px;padding:22px;border-bottom:1px solid var(--border);align-items:start}
.d-img{width:100px;height:138px;object-fit:cover;object-position:center top;border:2px solid var(--dac-c,var(--gold))}
.d-img.rc{object-position:right top}
.d-hdr-r h2{font-family:'Cinzel Decorative',serif;font-size:clamp(1.1rem,3vw,1.9rem);color:var(--dac-c,var(--gold));line-height:1;margin-bottom:5px}
.d-sub{font-family:'Cinzel',serif;font-size:.8rem;color:var(--txt2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:9px}
.d-how{font-family:'Rajdhani',sans-serif;font-size:.97rem;color:var(--txt);line-height:1.65;max-width:700px}
.d-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.d-tabs::-webkit-scrollbar{display:none}
.d-tab{font-family:'Rajdhani',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;padding:13px 17px;cursor:pointer;color:var(--txt3);border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none}
.d-tab:hover{color:var(--txt)}
.d-tab.on{color:var(--dac-c,var(--gold));border-bottom-color:var(--dac-c,var(--gold))}
.d-pnl{display:none;padding:22px}
.d-pnl.on{display:block;animation:fadeIn .3s ease}
/* ABC per-deck */
.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
.abc-row{display:flex;gap:11px;padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.abc-ltr{font-family:'Cinzel Decorative',serif;font-size:1.85rem;line-height:1;flex-shrink:0;width:30px;text-align:center;text-shadow:0 0 14px currentColor}
.abc-bd h4{font-family:'Cinzel',serif;font-size:.77rem;letter-spacing:.09em;color:var(--txt);margin-bottom:3px}
.abc-bd p{font-family:'Rajdhani',sans-serif;font-size:.85rem;color:var(--txt2);line-height:1.52}
/* STRATEGY */
.s-blk{margin-bottom:20px}
.s-blk h4{font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dac-c,var(--gold));margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.07)}
.s-blk p{font-family:'Rajdhani',sans-serif;font-size:.98rem;color:var(--txt);line-height:1.68}
/* ZONES */
.zone-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;margin-bottom:14px}
.zcard{padding:13px;background:rgba(255,255,255,.03);border:1px solid var(--dac-c,rgba(200,168,75,.28));cursor:pointer;transition:background .2s}
.zcard:hover{background:rgba(255,255,255,.06)}
.zcard-lbl{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dac-c,var(--gold));opacity:.7;margin-bottom:4px}
.zcard-name{font-family:'Cinzel',serif;font-size:.86rem;color:var(--txt);margin-bottom:4px}
.zcard-ab{font-family:'Rajdhani',sans-serif;font-size:.79rem;color:var(--txt2);line-height:1.48}
/* DECKLIST */
.dl-hdr{font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dac-c,var(--gold));margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.07)}
.dl-sub{font-family:'Rajdhani',sans-serif;font-size:.78rem;color:var(--txt3);margin-bottom:9px;letter-spacing:.05em}
.dl-sec{margin-bottom:22px}
.rune-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rune-pill{font-family:'Cinzel',serif;font-size:.76rem;padding:5px 13px;border:1px solid var(--dac-c,rgba(200,168,75,.4));color:var(--dac-c,var(--gold));letter-spacing:.09em;background:rgba(0,0,0,.3)}
.card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:3px}
.crow{display:flex;align-items:center;gap:7px;padding:7px 9px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);cursor:pointer;transition:all .2s}
.crow:hover{background:rgba(255,255,255,.07);border-color:var(--dac-c,rgba(200,168,75,.28))}
.c-qty{font-family:'Cinzel',serif;font-size:.71rem;font-weight:700;color:var(--dac-c,var(--gold));width:17px;text-align:center;flex-shrink:0}
.c-rar{font-size:.6rem;width:13px;flex-shrink:0;text-align:center;opacity:.8}
.c-name{font-family:'Rajdhani',sans-serif;font-size:.87rem;font-weight:500;color:var(--txt);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-cost{font-family:'Rajdhani',sans-serif;font-size:.68rem;color:var(--txt3);flex-shrink:0}
.rC{color:#aaa}.rU{color:#5b9bd5}.rR{color:#c8a84b}.rE{color:#c87cff}.rS{color:#ff6b6b}
.bf-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.bf-row{display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);cursor:pointer;transition:background .2s}
.bf-row:hover{background:rgba(255,255,255,.06)}
.bf-name{font-family:'Cinzel',serif;font-size:.82rem;color:var(--txt)}
.bf-ab{font-family:'Rajdhani',sans-serif;font-size:.78rem;color:var(--txt2);line-height:1.45}
/* TOOLTIP */
/* CARD OVERLAY */
#card-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);align-items:center;justify-content:center;cursor:pointer}
#card-overlay.on{display:flex}
#card-overlay img{max-height:85vh;max-width:min(340px,88vw);border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.9)}
#card-overlay .co-close{position:absolute;top:16px;right:16px;font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.15em;color:rgba(255,255,255,.5);text-transform:uppercase}
@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.csec{}
.chdr{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;cursor:pointer;transition:background .2s}
.chdr:hover{background:rgba(255,255,255,.03)}
footer{text-align:center;padding:28px;font-family:'Rajdhani',sans-serif;font-size:.73rem;color:var(--txt3);letter-spacing:.1em;border-top:1px solid rgba(200,168,75,.08);margin-top:30px}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,1fr)}.d-hdr{grid-template-columns:1fr}.d-img{display:none}.abc-grid,.abcd-grid{grid-template-columns:1fr}.card-list{grid-template-columns:1fr 1fr}.bf-list,.zone-row{grid-template-columns:1fr}}
@media(max-width:480px){.grid{gap:2px}.d-tab{padding:11px 12px;font-size:.75rem}.card-list{grid-template-columns:1fr}}

/* RUNE SYMBOLS */
.rune-symbols {
  position:absolute;
  bottom:8px;
  right:8px;
  display:flex;
  gap:5px;
  z-index:6;
}
.rune-sym {
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0.85;
  transition:opacity .3s;
  flex-shrink:0;
  cursor:pointer;
  background:rgba(0,0,0,.5);
  border-radius:4px;
}
.dcard:hover .rune-sym { opacity:1; }
</style>
</head>
<body>
<div class="page">
<div class="hd">
  <h1>RIFTBOUND</h1>
  <div class="div-line"></div>
  <p class="hd-sub">Origins &amp; Spiritforged</p>
  <p class="choose-txt" style="margin-top:18px">Choose Your Legend</p>
<p style="font-family:'Cinzel',serif;font-size:clamp(.55rem,1.2vw,.75rem);color:rgba(255,255,255,.25);letter-spacing:.35em;text-transform:uppercase;margin-top:6px;margin-bottom:0">Snow's Premade Decks</p>
</div>
<div class="grid" id="grid"></div>
<div id="card-overlay" onclick="closeCard()"><img id="co-img" src=""><div class="co-close">tap to close</div></div>
<footer>RIFTBOUND WAR TABLE &nbsp;·&nbsp; Origins &amp; Spiritforged &nbsp;·&nbsp; 8 Decks &nbsp;·&nbsp; Card content © Riot Games</footer>

<script>
const DECKS=[{"key":"azir","name":"Azir","legend_cid":"SFD-197","legend_name":"Azir - Emperor of the Sands","legend_ability":"Your Sand Soldiers have [WEAPONMASTER].  1, Exhaust: Play a 2 Might Sand Soldier unit token to your base. Use only if you've played an Equipment this turn.","champion_cid":"SFD-177","champion_name":"Azir - Sovereign","champion_cost":"4","champion_might":"4","champion_ability":"[ACCELERATE] (You may pay 1 and Order as an additional cost to have me enter ready.) When I attack, you may move any number of your token units to this battlefield.","champion_key":"azir","right_crop":true,"colors":"Calm+Order","style":"Token Army","tagline":"Flood both fields with Sand Soldiers every turn. Gear up. Grand Strategem. Win.","accent":"#F9A825","runes":["6x Calm (Green)","6x Order (Yellow)"],"battlefields":[{"cid":"SFD-207","name":"Emperor's Dais","ability":"When you conquer here, you may pay 1 and return a unit you control here to its owner's hand. If you do, play a 2 Might Sand Soldier unit token here."},{"cid":"SFD-210","name":"Hall of Legends","ability":"When you conquer here, you may pay 1 to ready your legend."},{"cid":"OGN-293","name":"The Grand Plaza","ability":"When you hold here, if you have 7+ units here, you win the game."}],"abcdefg":[{"letter":"A","phase":"Awaken","desc":"Untap all your Sand Soldiers and your legend. Count how many are on the board."},{"letter":"B","phase":"Board State","desc":"Score fields your Soldiers held. Each one = 1 point. Check the board."},{"letter":"C","phase":"Conjure","desc":"Draw your Calm and Order runes. You need them to play cards and attach gear."},{"letter":"D","phase":"Draw","desc":"Draw 1 card. Look for Arise! or Grand Strategem."},{"letter":"E","phase":"Execute","desc":"Play a Sand Soldier. Attach gear — costs 1 rune less on arrival (WEAPONMASTER)."},{"letter":"F","phase":"Field","desc":"Move Soldiers to both fields. Play Arise! to drop 4 Soldiers at once."},{"letter":"G","phase":"Go","desc":"Attack. Grand Strategem gives all units +5M. Conquer both fields."}],"how_it_plays":"ENGINE: Free Sand Soldier from legend every turn. WEAPONMASTER = gear attaches 1 rune cheaper. Arise! drops 4 Soldiers at once. Grand Strategem = all units +5M.\n\nDRAW: Desert's Call, Cull the Weak, Discipline. You never run out because your legend generates threats for free.\n\nGOING WIDE: This deck goes as wide as possible. You don't need big units. You need more units than they can block.\n\nKEY TURNS:\nTurn 1-2 — Eye of the Herald or Doran's Shield on first Soldier. Hold one field.\nTurn 3-4 — B.F. Sword on a second Soldier. Arise! if you have it. Both fields contested.\nTurn 5-6 — Grand Strategem. All Soldiers are 7M. Attack with everything. They can't block 7 units at once.\n\nWIN: Hold both fields at 6. Score to 7 during B. Conquer the open field for 8. Or flood so wide nobody can block everyone.","turn_order":"T1|Play Eye of the Herald|Attach to Soldier via legend — 1 rune less (WEAPONMASTER)|Hold one field\nT2|B.F. Sword on a second Soldier|Push into second field|Aim for 4+ Soldiers on board\nT5|Arise! — drop 4 Soldiers at once|Both fields flooded — they can't block 6 bodies\nT6+|Grand Strategem — every Soldier becomes 7M|Attack with everything|Nobody blocks 7 units — win","main_cards":[{"cid":"SFD-198","qty":1,"name":"Arise!","cost":6,"might":0,"rarity":"E","type":"Signature Spell","domain":"Calm;Order","ability":"Play a 2 Might Sand Soldier unit token for each Equipment you control. Then ready two of them."},{"cid":"SFD-051","qty":1,"name":"Guardian Angel","cost":2,"might":0,"rarity":"R","type":"Gear","domain":"Calm","ability":"[EQUIP Calm] (Calm: Attach this to a unit you control.) If I would die, kill Guardian Angel instead. Heal me, Exhaust me, and recall me. Might +1"},{"cid":"SFD-172","qty":1,"name":"Sacred Shears","cost":2,"might":0,"rarity":"R","type":"Gear","domain":"Order","ability":"[EQUIP Order] (Order: Attach this to a unit you control.)  [DEATHKNELL] - Draw 1. (When I di   teemo:  ['Mind','Chaos'],
};

const RUNE_CIDS={Fury:'OGN-007',Calm:'OGN-042',Mind:'OGN-089',Body:'OGN-126',Chaos:'OGN-166',Order:'OGN-214'};
function runeSymbols(key) {
  const runes = DECK_RUNES[key] || [];
  return '<div class="rune-symbols">' + runes.map(r => {
    const ri = RUNE_INFO[r];
    const cid = RUNE_CIDS[r]||'';
    return `<div class="rune-sym" onclick="event.stopPropagation();showCard('${cid}')">
      <img src="${ri.img}" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 4px ${ri.color})">
    </div>`;
  }).join('') + '</div>';
}

function renderGrid(){
  document.getElementById('grid').innerHTML=DECKS.map(d=>`
    <div class="dcard${d.right_crop?' rc':''}" id="dc-${d.key}" style="--ac:${d.accent}" onclick="pick('${d.key}')">
      <div class="dcard-bar"></div>
      <img class="dcard-img" src="${IMGS[d.champion_key]}" alt="${d.name}" onerror="this.style.display='none'" loading="lazy">
      ${runeSymbols(d.key)}
      <div class="dcard-body">
        <div class="dcard-tag" style="background:${d.accent}22;color:${d.accent};border:1px solid ${d.accent}44">${d.style}</div>
        <div class="dcard-name">${d.name}</div>
        <div class="dcard-tagline">${d.tagline}</div>
        <div class="dcard-colors">${d.colors}</div>
      </div>
    </div>`).join('');
}

function pick(key){
  document.querySelectorAll('.dcard').forEach(c=>c.classList.remove('on'));
  if(active===key){active=null;document.getElementById('detail').classList.remove('open');document.getElementById('detail').innerHTML='';return}
  active=key;document.getElementById('dc-'+key).classList.add('on');
  renderDetail(key);
  setTimeout(()=>document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'}),80);
}

function renderDetail(key){
  const d=DECKS.find(x=>x.key===key);
  const det=document.getElementById('detail');
  det.classList.add('open');
  const C='https://cdn.piltoverarchive.com/cards/';
  const RI={Fury:'OGN-007',Body:'OGN-126',Calm:'OGN-042',Order:'OGN-214',Mind:'OGN-089',Chaos:'OGN-166'};

  const abcdOnly=d.abcdefg.filter(s=>['A','B','C','D'].includes(s.letter));
  const efgOnly=d.abcdefg.filter(s=>!['A','B','C','D'].includes(s.letter));
  const abcHTML=abcdOnly.map((s,i)=>`
    <div class="abc-row">
      <div class="abc-ltr" style="color:${CLRS[i]}">${s.letter}</div>
      <div class="abc-bd"><h4>${s.phase}</h4><p>${s.desc}</p></div>
    </div>`).join('');
  const efgHTML=efgOnly.map((s,i)=>`
    <div class="abc-row">
      <div class="abc-ltr" style="color:${CLRS[i+4]||CLRS[i]}">${s.letter}</div>
      <div class="abc-bd"><h4>${s.phase}</h4><p>${s.desc}</p></div>
    </div>`).join('');

  const cardsHTML=d.main_cards.map(c=>`
    <div class="crow" onclick="showCard('${c.cid}')">
      <span class="c-qty">x${c.qty}</span>
      <span class="c-rar r${c.rarity}">${RSYM[c.rarity]||'·'}</span>
      <span class="c-name">${c.name}</span>
      <span style="font-family:'Rajdhani',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:2px;background:${DCOL[c.domain]||'rgba(255,255,255,.08)'};color:#fff;opacity:.8;flex-shrink:0">${c.type||''}</span>
      <span class="c-cost">${c.cost}/${c.might}</span>
    </div>`).join('');

  const sbHTML=d.sb_cards.map(c=>`
    <div class="crow" onclick="showCard('${c.cid}')">
      <span class="c-qty">x${c.qty}</span>
      <span class="c-rar r${c.rarity}">${RSYM[c.rarity]||'·'}</span>
      <span class="c-name">${c.name}</span>
      <span style="font-family:'Rajdhani',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:2px;background:${DCOL[c.domain]||'rgba(255,255,255,.08)'};color:#fff;opacity:.8;flex-shrink:0">${c.type||''}</span>
      <span class="c-cost">${c.cost}/${c.might}</span>
    </div>`).join('');

  const bfHTML=d.battlefields.map(bf=>`
    <div class="crow" onclick="showCard('${bf.cid}')">
      <span class="c-name">${bf.name}</span>
    </div>`).join('');

  const runeHTML=d.runes.map(r=>{
    const dom=r.replace(/\d+x |\(.*?\)/g,'').trim();
    return`<div class="rune-pill" style="cursor:pointer" onclick="showCard('${RI[dom]||''}')">${r}</div>`;
  }).join('');

  det.innerHTML=`
  <div class="d-wrap" style="--dac:${d.accent}44;--dac-c:${d.accent}">

    <!-- 1. NAME + DESCRIPTION -->
    <div style="padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.06)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <h2 style="font-family:'Cinzel Decorative',serif;font-size:clamp(1.2rem,3.5vw,2rem);color:var(--dac-c,var(--gold));line-height:1">${d.name}</h2>
        <span style="font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--dac-c,var(--gold));opacity:.65">${d.style}</span>
      </div>
      <p style="font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:600;color:var(--txt);line-height:1.55">${d.tagline}</p>
    </div>

    <!-- 2. LEGEND + CHAMPION CARDS -->
    <div style="display:flex;gap:10px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06)">
      <div style="flex:1;cursor:pointer" onclick="showCard('${d.legend_cid}')">
        <img src="${C}${d.legend_cid}.webp" style="width:100%;border-radius:4px;border:2px solid var(--dac-c,var(--gold));display:block" onerror="this.style.display='none'">
        <div style="font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.1em;color:var(--dac-c,var(--gold));text-transform:uppercase;margin-top:4px;opacity:.7">Legend</div>
      </div>
      <div style="flex:1;cursor:pointer" onclick="showCard('${d.champion_cid}')">
        <img src="${C}${d.champion_cid}.webp" style="width:100%;border-radius:4px;border:2px solid rgba(11,196,227,.5);display:block" onerror="this.style.display='none'">
        <div style="font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.1em;color:rgba(11,196,227,.7);text-transform:uppercase;margin-top:4px;opacity:.7">Champion · ${d.champion_cost} cost · ${d.champion_might}M</div>
      </div>
    </div>

    <!-- SYNERGY -->
    <div style="padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.06)">
      <p style="font-family:'Rajdhani',sans-serif;font-size:.92rem;color:var(--txt2);line-height:1.6;font-style:italic">${d.synergy||''}</p>
    </div>

    <!-- 3. FULL DECKLIST — collapsed -->
    <div style="border-bottom:1px solid rgba(255,255,255,.06)">
      <div class="chdr" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.querySelector('.carr').textContent=this.nextElementSibling.style.display==='none'?'▼':'▲'">
        <span style="font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2)">Full Decklist</span>
        <span class="carr" style="color:var(--txt3);font-size:.7rem">▼</span>
      </div>
      <div style="display:none;padding:0 20px 20px">
        <div style="font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dac-c,var(--gold));margin-bottom:8px">Main — 40 Cards</div>
        <div class="card-list">${cardsHTML}</div>
        <div style="font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dac-c,var(--gold));margin:14px 0 8px">Sideboard — 8 Cards</div>
        <div class="card-list">${sbHTML}</div>
        <div style="font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dac-c,var(--gold));margin:14px 0 8px">Rune Deck — 12 Cards</div>
        <div>${d.runes.map(r=>{const dom=r.replace(/\d+x |\(.*?\)/g,'').trim();const ri=RUNE_INFO[dom]||{color:'#aaa',img:''};const cid=RUNE_CIDS[dom]||'';return`<div class="crow" onclick="showCard('${cid}')"><span class="c-qty">${r.match(/\d+/)[0]}x</span><img src="${ri.img}" style="width:16px;height:16px;object-fit:contain;filter:drop-shadow(0 0 3px ${ri.color});flex-shrink:0"><span class="c-name" style="color:${ri.color}">${dom} Rune</span></div>`;}).join('')}</div>
        <div style="font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dac-c,var(--gold));margin:14px 0 8px">Battlefields</div>
        <div class="card-list">${bfHTML}</div>
      </div>
    </div>

    <!-- 4. STRATEGY — collapsed -->
    <div style="border-bottom:1px solid rgba(255,255,255,.06)">
      <div class="chdr" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.querySelector('.carr').textContent=this.nextElementSibling.style.display==='none'?'▼':'▲'">
        <span style="font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2)">Strategy</span>
        <span class="carr" style="color:var(--txt3);font-size:.7rem">▼</span>
      </div>
      <div style="display:none;padding:0 20px 20px">
        <p style="font-family:'Rajdhani',sans-serif;font-size:1rem;color:var(--txt);line-height:1.7;border-left:3px solid var(--dac-c,var(--gold));padding-left:14px;margin-bottom:18px">${d.how_it_plays}</p>
        <div style="font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dac-c,var(--gold));margin-bottom:10px">Early · Mid · Late</div>
        <div id="turn-blocks">${d.turn_order.split('\n').map(line=>{
  const parts=line.split('|');
  const turn=parts[0];
  const bullets=parts.slice(1);
  return `<div style="margin-bottom:14px">
    <div style="font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dac-c,var(--gold));margin-bottom:5px">${turn}</div>
    ${bullets.map(b=>`<div style="font-family:'Rajdhani',sans-serif;font-size:.96rem;color:var(--txt);line-height:1.6;padding-left:12px;border-left:2px solid rgba(200,168,75,.25);margin-bottom:3px">— ${b}</div>`).join('')}
  </div>`;
}).join('')}</div>
        <div style="height:1px;background:rgba(255,255,255,.07);margin-bottom:18px"></div>
        <div class="abc-grid">${abcHTML}</div>
        <div style="height:1px;background:rgba(255,255,255,.07);margin:18px 0"></div>
        <div class="abc-grid">${efgHTML}</div>
      </div>
    </div>



  </div>`;
}


function switchTab(key,tab){atab=tab;renderDetail(key)}

const CARD_CDN='https://cdn.piltoverarchive.com/cards/';
function showCard(cid){
  if(!cid)return;
  const src=cid.startsWith('http')?cid:CARD_CDN+cid+'.webp';
  document.getElementById('co-img').src=src;
  document.getElementById('card-overlay').classList.add('on');
}
function closeCard(){document.getElementById('card-overlay').classList.remove('on')}
function showTT(ev,name,stats,ab){}
function hideTT(){}
function toggleHTP(){}

renderGrid();
</script>
</body>
</html>
